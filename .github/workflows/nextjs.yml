# CI workflow for GardenGenius
# Deploy this app via Vercel at https://vercel.com/new — NOT GitHub Pages.
# API routes, Prisma, auth, and Stripe require a Node.js server.

name: CI

on:
  push:
    branches: ["main", "claude/gardengenius-saas-app-289Rv"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"

      - name: Type check
        run: npx tsc --noEmit
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          NEXTAUTH_SECRET: "ci-secret-32-chars-xxxxxxxxxxxxxxx"
          NEXTAUTH_URL: "http://localhost:3000"
          ANTHROPIC_API_KEY: "sk-ant-stub"
          STRIPE_SECRET_KEY: "sk_test_stub"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_stub"
          STRIPE_WEBHOOK_SECRET: "whsec_stub"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

      - name: Lint
        run: npm run lint
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          NEXTAUTH_SECRET: "ci-secret-32-chars-xxxxxxxxxxxxxxx"
          NEXTAUTH_URL: "http://localhost:3000"
          ANTHROPIC_API_KEY: "sk-ant-stub"
          STRIPE_SECRET_KEY: "sk_test_stub"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_stub"
          STRIPE_WEBHOOK_SECRET: "whsec_stub"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
